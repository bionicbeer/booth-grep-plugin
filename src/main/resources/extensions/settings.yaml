apiVersion: v1alpha1
kind: Setting
metadata:
  name: booth-grep-settings
spec:
  forms:
    - group: ai
      label: AI 内容整理设置
      formSchema:
        - $formkit: aiModelSelector
          name: modelName
          label: 内容整理模型
          modelType: language
          available: true
          clearable: true
          help: "用于标题与描述内容整理的语言模型，留空时使用 AI Foundation 默认语言模型"
        - $formkit: textarea
          name: titlePrompt
          label: 标题整理默认提示词
          rows: 3
          help: "整理标题时使用的默认提示词"
        - $formkit: textarea
          name: descriptionPrompt
          label: 描述整理默认提示词
          rows: 5
          help: "整理商品描述时使用的默认提示词"
